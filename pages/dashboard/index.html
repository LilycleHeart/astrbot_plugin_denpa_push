<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>电波推送 · Signal Observatory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div class="observatory" id="app">

      <!-- ═══ Header ═══ -->
      <header class="header">
        <div class="header-logo">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <div class="header-info">
          <h1 class="header-title">电波推送</h1>
          <span class="header-sub">DenpaPush · Signal Observatory</span>
        </div>
        <div class="header-status inactive" id="monitor-status">
          <span class="status-dot"></span>
          <span id="status-text">离线</span>
        </div>
      </header>

      <!-- ═══ 波形签名区 ═══ -->
      <section class="waveform-section">
        <canvas class="waveform-canvas" id="waveform"></canvas>
        <div class="waveform-overlay">
          <div class="wave-stat">
            <span class="wave-stat-value" id="stat-subs">0</span>
            <span class="wave-stat-label">追踪中</span>
          </div>
          <div class="wave-stat">
            <span class="wave-stat-value" id="stat-pushes">0</span>
            <span class="wave-stat-label">已推送</span>
          </div>
          <div class="wave-stat">
            <span class="wave-stat-value" id="stat-interval">5m</span>
            <span class="wave-stat-label">轮询间隔</span>
          </div>
        </div>
      </section>

      <!-- ═══ 舱体网格 ═══ -->
      <div class="pod-grid">

        <!-- 订阅管理 -->
        <div class="pod pod-full">
          <div class="pod-header">
            <div class="pod-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <span class="pod-title">信号源 · 订阅管理</span>
            <div style="flex:1"></div>
            <select class="session-select" id="session-select">
              <option value="__all__">全部会话</option>
            </select>
          </div>
          <ul class="sub-list" id="sub-list">
            <li class="empty-state" id="sub-empty">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10zm-8-7L4 6h16l-8 5z"/></svg>
              <p>暂无订阅，添加 Twitter 账号开始监控</p>
            </li>
          </ul>
          <div class="add-form">
            <input class="add-input" id="add-input" type="text" placeholder="@username" spellcheck="false" />
            <button class="btn btn-signal" id="add-btn">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
              追踪
            </button>
          </div>
        </div>

        <!-- 推送日志 -->
        <div class="pod pod-full">
          <div class="pod-header">
            <div class="pod-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            </div>
            <span class="pod-title">信号日志</span>
          </div>
          <div class="log-list" id="log-list">
            <div class="empty-state" id="log-empty">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
              <p>等待信号捕获…</p>
            </div>
          </div>
        </div>

        <!-- 配置速览 -->
        <div class="pod">
          <div class="pod-header">
            <div class="pod-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </div>
            <span class="pod-title">观测参数</span>
          </div>
          <div class="config-grid" id="config-grid">
            <div class="config-row"><span class="config-key">轮询间隔</span><span class="config-val" id="cfg-interval">—</span></div>
            <div class="config-row"><span class="config-key">翻译语言</span><span class="config-val" id="cfg-lang">—</span></div>
            <div class="config-row"><span class="config-key">取色来源</span><span class="config-val" id="cfg-color">—</span></div>
            <div class="config-row"><span class="config-key">GIF 编码</span><span class="config-val" id="cfg-gif">—</span></div>
            <div class="config-row"><span class="config-key">代理</span><span class="config-val" id="cfg-proxy">—</span></div>
          </div>
        </div>

        <!-- 运行状态 -->
        <div class="pod">
          <div class="pod-header">
            <div class="pod-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            </div>
            <span class="pod-title">运行状态</span>
          </div>
          <div class="config-grid">
            <div class="config-row"><span class="config-key">监控循环</span><span class="config-val" id="rt-loop">—</span></div>
            <div class="config-row"><span class="config-key">会话数</span><span class="config-val" id="rt-sessions">—</span></div>
            <div class="config-row"><span class="config-key">Twitter 认证</span><span class="config-val" id="rt-auth">—</span></div>
            <div class="config-row"><span class="config-key">Playwright</span><span class="config-val" id="rt-pw">—</span></div>
          </div>
        </div>

      </div><!-- /pod-grid -->
    </div><!-- /observatory -->

    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
