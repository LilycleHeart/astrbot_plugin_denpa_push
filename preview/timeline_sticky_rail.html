<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>时间线预览 A — 粘性竖轨 + 横排时间</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --brand: #6750a4; --brand-on: #fff; --brand-surface: #eaddff; --brand-weak: #f3edf7;
  --fg-1: #e6e1e5; --fg-2: #cac4d0; --fg-3: #938f99;
  --bg: #141218; --bg-1: #1d1b20; --bg-2: #211f26; --bg-3: #2b2930;
  --stroke-1: #49454f; --stroke-2: #938f99;
  --radius: 14px;
  --font: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--fg-1); font-family: var(--font); padding: 24px; }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin-bottom: 4px; }
.desc { color: var(--fg-3); font-size: 13px; margin-bottom: 24px; }

/* === 核心：粘性竖轨时间线 === */
.timeline-container {
  position: relative;
  max-width: 900px;
  margin: 0 auto;
}
/* 左侧固定竖线 */
.timeline-rail {
  position: sticky;
  top: 0;
  left: 0;
  width: 60px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 20px;
  pointer-events: none;
  z-index: 5;
}
/* 竖线本体 */
.timeline-rail::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, transparent, var(--stroke-1) 10%, var(--stroke-1) 90%, transparent);
  transform: translateX(-50%);
}
/* 当前时间指示器 — 滑动时跟随 */
.timeline-indicator {
  position: sticky;
  top: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: var(--brand);
  color: var(--brand-on);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-mono);
  box-shadow: 0 4px 12px rgba(103, 80, 164, 0.4);
  z-index: 10;
  white-space: nowrap;
  transform: translateX(-50%);
  left: 30px;
}
.timeline-indicator::before {
  content: "";
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--brand-on);
  box-shadow: 0 0 8px var(--brand-on);
}

/* 卡片网格 */
.timeline-grid {
  margin-left: 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 20px;
  padding-bottom: 200px;
}
/* 每个卡片条目 */
.tl-entry {
  position: relative;
}
/* 卡片左侧连接线到竖轨 */
.tl-entry::before {
  content: "";
  position: absolute;
  left: -20px;
  top: 24px;
  width: 16px;
  height: 2px;
  background: var(--stroke-1);
}
/* 卡片上的小节点 */
.tl-entry::after {
  content: "";
  position: absolute;
  left: -24px;
  top: 19px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--brand);
  border: 2px solid var(--bg);
  z-index: 1;
}

/* 卡片本体 */
.card {
  background: var(--bg-2);
  border-radius: 20px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--brand-on); font-weight: 700; font-size: 16px; }
.card-name { font-weight: 600; font-size: 14px; }
.card-handle { font-size: 12px; color: var(--fg-3); }
.card-time { margin-left: auto; font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }
.card-body { font-size: 14px; line-height: 1.6; color: var(--fg-2); margin-bottom: 8px; }
.card-trans { font-size: 13px; line-height: 1.5; color: var(--fg-3); padding-left: 10px; border-left: 2px solid var(--brand); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(103,80,164,0.15); color: var(--brand); margin-top: 8px; }
</style>
</head>
<body>

<h1>方案 A — 粘性竖轨 + 横排时间指示器</h1>
<p class="desc">左侧是一条独立的竖直线，始终固定在视口左侧。顶部有一个跟随滚动的时间指示器气泡，显示当前可见区域的时间。卡片通过连接线挂载到竖轨上。</p>

<div class="timeline-container">
  <div class="timeline-rail">
    <div class="timeline-indicator" id="indicator">08月01日 14:32</div>
  </div>
  <div class="timeline-grid" id="grid">
    <!-- 卡片由JS生成 -->
  </div>
</div>

<script>
const items = [
  { name: 'Apex', handle: 'PlayApex', time: '08/01 14:32', text: 'New season launch trailer!', trans: '新赛季发布预告！' },
  { name: 'EVE', handle: 'eveonline', time: '08/01 12:05', text: 'Fleet engagement in null-sec', trans: '零安地区舰队交战' },
  { name: 'Hideo', handle: 'HideoKojima', time: '08/01 09:18', text: 'Working on new project', trans: '正在开发新项目' },
  { name: 'Steam', handle: 'Steam', time: '07/31 22:44', text: 'Weekend deal up to 80% off', trans: '周末特惠低至2折' },
  { name: 'GitHub', handle: 'github', time: '07/31 18:30', text: 'New feature: Copilot Workspace', trans: '新功能：Copilot 工作区' },
  { name: 'CDPR', handle: 'CDPROJEKTRED', time: '07/31 15:12', text: 'Patch 2.1 is live', trans: '2.1 补丁已上线' },
  { name: 'Unity', handle: 'unity', time: '07/30 11:00', text: 'Unity 6 preview available', trans: 'Unity 6 预览版可用' },
  { name: ' Valve', handle: 'valve', time: '07/30 08:45', text: 'Deadlock playtest ongoing', trans: 'Deadlock 测试进行中' },
];

const grid = document.getElementById('grid');
items.forEach(it => {
  const el = document.createElement('div');
  el.className = 'tl-entry';
  el.dataset.time = it.time;
  el.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="avatar">${it.name[0]}</div>
        <div>
          <div class="card-name">${it.name}</div>
          <div class="card-handle">@${it.handle}</div>
        </div>
        <span class="card-time">${it.time}</span>
      </div>
      <div class="card-body">${it.text}</div>
      <div class="card-trans">${it.trans}</div>
      <span class="tag">✓ 已推送</span>
    </div>
  `;
  grid.appendChild(el);
});

// 滚动时更新指示器时间
const indicator = document.getElementById('indicator');
window.addEventListener('scroll', () => {
  const entries = document.querySelectorAll('.tl-entry');
  const viewportCenter = window.scrollY + window.innerHeight / 3;
  let closest = entries[0];
  let minDist = Infinity;
  entries.forEach(e => {
    const rect = e.getBoundingClientRect();
    const center = rect.top + window.scrollY + rect.height / 2;
    const dist = Math.abs(center - viewportCenter);
    if (dist < minDist) { minDist = dist; closest = e; }
  });
  indicator.textContent = closest.dataset.time;
});
</script>
</body>
</html>
