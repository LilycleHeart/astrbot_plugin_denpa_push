<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>电波图预览 C — 未来感双层粒子波形</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0f1a;
  color: #e2e2e6;
  font-family: 'Inter', system-ui, sans-serif;
  padding: 24px;
}
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin-bottom: 4px; }
.desc { color: #6b7280; font-size: 13px; margin-bottom: 24px; }

.dual-frame {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 240px;
  border-radius: 16px;
  overflow: hidden;
  background:
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(142, 205, 248, 0.06), transparent),
    radial-gradient(ellipse 60% 50% at 20% 0%, rgba(168, 85, 247, 0.04), transparent),
    #0d0f1a;
  border: 1px solid rgba(142, 205, 248, 0.08);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
              inset 0 0 40px rgba(142, 205, 248, 0.02);
}
canvas { display: block; width: 100%; height: 100%; }

.dual-label {
  position: absolute;
  top: 14px;
  left: 18px;
  z-index: 4;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(142, 205, 248, 0.4);
  letter-spacing: 1.2px;
  text-transform: uppercase;
}
.dual-stats {
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 4;
  display: flex;
  gap: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: rgba(142, 205, 248, 0.5);
}
.dual-stats span { color: #8ecdf8; font-weight: 600; text-shadow: 0 0 6px rgba(142,205,248,0.3); }

/* 角标装饰 */
.corner {
  position: absolute;
  width: 16px; height: 16px;
  border: 1px solid rgba(142, 205, 248, 0.2);
  z-index: 4;
}
.corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
.corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
.corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }
</style>
</head>
<body>

<h1>方案 C — 未来感双层粒子波形</h1>
<p class="desc">主波形 + 回声波层叠加，扫描头由粒子构成并拖出粒子尾迹。背景有动态网格脉动，四角带科技感装饰线。品牌色主波 + 紫色回声层。</p>

<div class="dual-frame">
  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>
  <span class="dual-label">DENPAPUSH · ECG MATRIX</span>
  <div class="dual-stats">
    <span id="freq">2.4</span>Hz · <span id="amp-val">1.2</span>mV
  </div>
  <canvas id="ecg"></canvas>
</div>

<script>
class DualLayerECG {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.offset = 0;
    this.echoOffset = 0;
    this.speed = 1.1;
    this.cycleLen = 280;
    this.particles = [];
    this.gridPulse = 0;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this._resize();
    window.addEventListener("resize", () => this._resize());
    this._loop();
  }
  _resize() {
    const w = this.canvas.clientWidth;
    const h = this.canvas.clientHeight;
    if (!w || !h) return;
    this.canvas.width = w * this.dpr;
    this.canvas.height = h * this.dpr;
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.w = w; this.h = h;
  }
  _ecgY(x) {
    const p = ((x % this.cycleLen) + this.cycleLen) % this.cycleLen;
    const t = p / this.cycleLen;
    let y = 0;
    y += 0.12 * Math.exp(-Math.pow((t - 0.12) / 0.022, 2));
    y -= 0.08 * Math.exp(-Math.pow((t - 0.27) / 0.008, 2));
    y += 0.85 * Math.exp(-Math.pow((t - 0.29) / 0.006, 2));
    y -= 0.28 * Math.exp(-Math.pow((t - 0.31) / 0.010, 2));
    y += 0.20 * Math.exp(-Math.pow((t - 0.42) / 0.035, 2));
    y += (Math.random() - 0.5) * 0.004;
    return y;
  }
  _loop() {
    this._draw();
    requestAnimationFrame(() => this._loop());
  }
  _draw() {
    const { ctx, w, h } = this;
    if (!w || !h) { this._resize(); return; }
    ctx.clearRect(0, 0, w, h);

    this.offset += this.speed;
    this.echoOffset += this.speed * 0.7;
    this.gridPulse += 0.02;
    const mid = h * 0.52;
    const amp = h * 0.35;

    // 动态脉动网格
    const gridAlpha = 0.03 + Math.sin(this.gridPulse) * 0.015;
    ctx.strokeStyle = `rgba(142, 205, 248, ${gridAlpha})`;
    ctx.lineWidth = 1;
    const gridSize = 32;
    const gridShift = (this.offset * 0.3) % gridSize;
    for (let gx = -gridShift; gx < w; gx += gridSize) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
    for (let gy = 0; gy < h; gy += gridSize) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }

    // 构建主波形 + 回声波形点
    const mainPts = [];
    const echoPts = [];
    const step = 1.5;
    for (let x = 0; x <= w; x += step) {
      mainPts.push({ x, y: mid - this._ecgY(x + this.offset) * amp });
      echoPts.push({ x, y: mid - this._ecgY(x + this.echoOffset + 40) * amp * 0.5 });
    }

    // 回声层 — 紫色半透明
    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = "rgba(168, 85, 247, 0.15)";
    ctx.lineWidth = 3;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    echoPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();

    // 主波形 — 品牌色 + 多层辉光
    const layers = [
      { width: 6, alpha: 0.06 },
      { width: 4, alpha: 0.12 },
      { width: 2, alpha: 0.25 },
    ];
    layers.forEach(layer => {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(142, 205, 248, ${layer.alpha})`;
      ctx.lineWidth = layer.width;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      mainPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
      ctx.stroke();
    });

    // 主线
    ctx.save();
    ctx.shadowColor = "#8ecdf8";
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.strokeStyle = "#8ecdf8";
    ctx.lineWidth = 1.8;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    mainPts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();

    // 粒子扫描头
    const head = mainPts[mainPts.length - 1];
    if (head) {
      // 生成粒子
      if (Math.random() > 0.3) {
        this.particles.push({
          x: head.x,
          y: head.y,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 2,
          life: 1,
          size: Math.random() * 2 + 1
        });
      }

      // 更新+绘制粒子
      ctx.save();
      this.particles = this.particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) return false;
        ctx.shadowColor = "#8ecdf8";
        ctx.shadowBlur = 6;
        ctx.fillStyle = `rgba(142, 205, 248, ${p.life * 0.7})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        return true;
      });
      ctx.restore();

      // 扫描头核心
      ctx.save();
      ctx.shadowColor = "#8ecdf8";
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(head.x, head.y, 3, 0, Math.PI * 2);
      ctx.fill();
      // 外环
      ctx.shadowBlur = 24;
      ctx.strokeStyle = "rgba(142, 205, 248, 0.4)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(head.x, head.y, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 垂直扫描线
      ctx.beginPath();
      ctx.strokeStyle = "rgba(142, 205, 248, 0.08)";
      ctx.lineWidth = 1;
      ctx.moveTo(head.x, 0);
      ctx.lineTo(head.x, h);
      ctx.stroke();
    }
  }
}

const ecg = new DualLayerECG(document.getElementById("ecg"));

// 数值波动
setInterval(() => {
  document.getElementById("freq").textContent = (2.0 + Math.random() * 0.8).toFixed(1);
  document.getElementById("amp-val").textContent = (0.9 + Math.random() * 0.6).toFixed(1);
}, 1500);
</script>
</body>
</html>
