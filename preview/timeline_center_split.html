<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>时间线预览 B — 居中竖线 + 交替卡片</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --brand: #6750a4; --brand-on: #fff; --brand-surface: #eaddff; --brand-weak: #f3edf7;
  --fg-1: #e6e1e5; --fg-2: #cac4d0; --fg-3: #938f99;
  --bg: #141218; --bg-1: #1d1b20; --bg-2: #211f26; --bg-3: #2b2930;
  --stroke-1: #49454f; --stroke-2: #938f99;
  --font: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--fg-1); font-family: var(--font); padding: 24px; }
h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin-bottom: 4px; }
.desc { color: var(--fg-3); font-size: 13px; margin-bottom: 32px; }

/* === 核心：居中竖线交替时间线 === */
.timeline-wrap {
  position: relative;
  max-width: 1000px;
  margin: 0 auto;
}
/* 居中竖线 — 独立于卡片 */
.timeline-wrap::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom,
    transparent 0%,
    var(--stroke-1) 5%,
    var(--stroke-1) 95%,
    transparent 100%);
  transform: translateX(-50%);
  z-index: 0;
}
/* 顶部时间指示器 — sticky 跟随滚动 */
.time-indicator {
  position: sticky;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 16px;
  background: var(--brand);
  color: var(--brand-on);
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-mono);
  box-shadow: 0 4px 16px rgba(103, 80, 164, 0.5);
  z-index: 20;
  white-space: nowrap;
  margin-bottom: 40px;
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
  display: flex;
}
.time-indicator::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--brand-on);
  box-shadow: 0 0 6px var(--brand-on);
}

/* 交替条目 */
.tl-row {
  display: flex;
  align-items: flex-start;
  margin-bottom: 32px;
  position: relative;
}
.tl-row.left { justify-content: flex-end; padding-right: calc(50% + 24px); }
.tl-row.right { justify-content: flex-start; padding-left: calc(50% + 24px); }

/* 竖线上的节点 */
.tl-node {
  position: absolute;
  left: 50%;
  top: 28px;
  transform: translateX(-50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg);
  border: 3px solid var(--brand);
  box-shadow: 0 0 0 4px rgba(103, 80, 164, 0.15);
  z-index: 2;
}
/* 节点到卡片的连接线 */
.tl-row.left .tl-connector {
  position: absolute;
  right: calc(50% + 7px);
  top: 34px;
  width: 17px;
  height: 2px;
  background: var(--stroke-1);
}
.tl-row.right .tl-connector {
  position: absolute;
  left: calc(50% + 7px);
  top: 34px;
  width: 17px;
  height: 2px;
  background: var(--stroke-1);
}

/* 时间标签 — 在竖线另一侧 */
.tl-row.left .tl-time-side {
  position: absolute;
  left: calc(50% + 20px);
  top: 24px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-3);
  white-space: nowrap;
}
.tl-row.right .tl-time-side {
  position: absolute;
  right: calc(50% + 20px);
  top: 24px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-3);
  text-align: right;
  white-space: nowrap;
}

/* 卡片 */
.card {
  background: var(--bg-2);
  border-radius: 20px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  max-width: 420px;
  width: 100%;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--brand-on); font-weight: 700; font-size: 16px; }
.card-name { font-weight: 600; font-size: 14px; }
.card-handle { font-size: 12px; color: var(--fg-3); }
.card-time { margin-left: auto; font-size: 11px; color: var(--fg-3); font-family: var(--font-mono); }
.card-body { font-size: 14px; line-height: 1.6; color: var(--fg-2); margin-bottom: 8px; }
.card-trans { font-size: 13px; line-height: 1.5; color: var(--fg-3); padding-left: 10px; border-left: 2px solid var(--brand); }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: rgba(103,80,164,0.15); color: var(--brand); margin-top: 8px; }

@media (max-width: 768px) {
  .timeline-wrap::before { left: 20px; }
  .tl-row.left, .tl-row.right { padding: 0 0 0 48px; justify-content: flex-start; }
  .tl-node { left: 20px; }
  .tl-row.left .tl-connector, .tl-row.right .tl-connector { left: 27px; right: auto; }
  .tl-row.left .tl-time-side, .tl-row.right .tl-time-side { position: static; margin-bottom: 6px; }
  .time-indicator { left: 20px; transform: none; }
}
</style>
</head>
<body>

<h1>方案 B — 居中竖线 + 交替卡片</h1>
<p class="desc">竖线位于内容区正中央，卡片交替排列在左右两侧。每个卡片通过节点和连接线挂载到竖线上，时间标签显示在竖线对侧。顶部有跟随滚动的当前时间指示器。</p>

<div class="time-indicator" id="indicator">08月01日 14:32</div>

<div class="timeline-wrap" id="wrap">
  <!-- 卡片由JS生成 -->
</div>

<script>
const items = [
  { name: 'Apex', handle: 'PlayApex', time: '08/01 14:32', text: 'New season launch trailer!', trans: '新赛季发布预告！', side: 'left' },
  { name: 'EVE', handle: 'eveonline', time: '08/01 12:05', text: 'Fleet engagement in null-sec region.', trans: '零安地区舰队交战。', side: 'right' },
  { name: 'Koji', handle: 'HideoKojima', time: '08/01 09:18', text: 'Working on a new project with the team.', trans: '正在与团队开发新项目。', side: 'left' },
  { name: 'Steam', handle: 'Steam', time: '07/31 22:44', text: 'Weekend deal is live, up to 80% off!', trans: '周末特惠已上线，低至2折！', side: 'right' },
  { name: 'GitHub', handle: 'github', time: '07/31 18:30', text: 'New feature: Copilot Workspace now in preview.', trans: '新功能：Copilot 工作区预览版。', side: 'left' },
  { name: 'CDPR', handle: 'CDPROJEKTRED', time: '07/31 15:12', text: 'Patch 2.1 is now live on all platforms.', trans: '2.1 补丁已在全平台上线。', side: 'right' },
  { name: 'Unity', handle: 'unity', time: '07/30 11:00', text: 'Unity 6 preview is now available for developers.', trans: 'Unity 6 预览版现已面向开发者开放。', side: 'left' },
  { name: 'Valve', handle: 'valve', time: '07/30 08:45', text: 'Deadlock playtest is ongoing, invite friends!', trans: 'Deadlock 测试进行中，邀请好友！', side: 'right' },
];

const wrap = document.getElementById('wrap');
items.forEach(it => {
  const el = document.createElement('div');
  el.className = `tl-row ${it.side}`;
  el.dataset.time = it.time;
  el.innerHTML = `
    <div class="tl-node"></div>
    <div class="tl-connector"></div>
    <div class="tl-time-side">${it.time}</div>
    <div class="card">
      <div class="card-header">
        <div class="avatar">${it.name[0]}</div>
        <div>
          <div class="card-name">${it.name}</div>
          <div class="card-handle">@${it.handle}</div>
        </div>
        <span class="card-time">${it.time}</span>
      </div>
      <div class="card-body">${it.text}</div>
      <div class="card-trans">${it.trans}</div>
      <span class="tag">✓ 已推送</span>
    </div>
  `;
  wrap.appendChild(el);
});

// 滚动时更新指示器时间
const indicator = document.getElementById('indicator');
window.addEventListener('scroll', () => {
  const entries = document.querySelectorAll('.tl-row');
  const viewportCenter = window.scrollY + window.innerHeight / 3;
  let closest = entries[0];
  let minDist = Infinity;
  entries.forEach(e => {
    const rect = e.getBoundingClientRect();
    const center = rect.top + window.scrollY + rect.height / 2;
    const dist = Math.abs(center - viewportCenter);
    if (dist < minDist) { minDist = dist; closest = e; }
  });
  if (closest) indicator.textContent = closest.dataset.time;
});
</script>
</body>
</html>
